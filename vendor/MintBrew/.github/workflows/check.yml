name: Build and test
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools python3-pil fonts-dejavu-core libvulkan-dev mesa-vulkan-drivers build-essential
      - run: bash homebrew-launcher/build-launcher.sh --check
      - run: node apps/hello-world/check.cjs
      - run: node sdk/tests/launcher.cjs
      - run: git diff --exit-code -- apps/hello-world/assets/state.bin apps/hello-world/assets/text.bin homebrew-launcher/shaders/launcher-text.bin
