name: macos build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Build mac2jb
        run: |
          make clean
          make

      - name: Verify executables
        run: |
          ./mac2jb-send --help
          ./mac2jb-commands --dry-run

      - name: Verify library linking
        run: |
          otool -L mac2jb-send
          otool -L mac2jb-commands
          otool -L vendor/libusbd/libusbd.dylib

      - name: Verify bootstrap integrity
        run: |
          shasum -a 256 -c assets/bootstrap.bas.sha256

      - name: Set up Node.js for ns2jb tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify ns2jb snapshot and tests
        run: |
          (cd vendor/ns2jb && shasum -a 256 -c SHA256SUMS)
          node --test vendor/ns2jb/test.cjs scripts/test-gui-host.cjs

      - name: Check shell script syntax
        run: |
          bash -n make-release-zip.command
          bash -n mac2jb.command
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Build release archive
        run: |
          bash make-release-zip.command
          unzip -t mac2jb-complete.zip
          python3 scripts/audit-release.py mac2jb-complete.zip

      - name: Set up bundled GUI runtime version
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build and verify GUI demo without hardware
        run: |
          NODE_BINARY="$(command -v node)" bash scripts/build-gui.sh
          "build/mac2jb.app/Contents/MacOS/mac2jb" --self-test
          python3 scripts/audit-release.py .build-gui/mac2jb-0.3.0-demo-source.zip
