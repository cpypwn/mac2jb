name: macos build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Build mac2jb
        run: |
          make clean
          make

      - name: Verify executables
        run: |
          ./mac2jb-send --help
          ./mac2jb-commands --dry-run

      - name: Verify library linking
        run: |
          otool -L mac2jb-send
          otool -L mac2jb-commands
          otool -L vendor/libusbd/libusbd.dylib

      - name: Verify bootstrap integrity
        run: |
          shasum -a 256 -c assets/bootstrap.bas.sha256

      - name: Check shell script syntax
        run: |
          bash -n make-release-zip.command
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Build release archive
        run: |
          bash make-release-zip.command
          unzip -t mac2jb-complete.zip
```
