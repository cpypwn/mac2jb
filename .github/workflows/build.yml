name: macos build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up bundled Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install build tools
        run: brew install cmake

      - name: Check source and scripts
        run: |
          bash scripts/check.sh
          for script in scripts/*.sh; do bash -n "$script"; done
          node scripts/prepare-host-profiles.cjs --check
          node integrations/civswitch/verify.cjs --source
          node --test vendor/ns2jb/test.cjs

      - name: Build and verify the Mac app
        run: |
          NODE_BINARY="$(command -v node)" bash scripts/build-gui.sh build/mac2jb.app
          build/mac2jb.app/Contents/MacOS/mac2jb --self-test
          SDK_VERSION="$(xcrun vtool -show-build build/mac2jb.app/Contents/MacOS/mac2jb | awk '$1 == "sdk" { print $2; exit }')"
          [[ "$SDK_VERSION" == 26.* ]] || { echo "Expected macOS SDK 26.x, got ${SDK_VERSION:-unknown}" >&2; exit 1; }
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' gui/Info.plist)"
          python3 scripts/audit-release.py ".build-gui/mac2jb-${VERSION}-source.zip"
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :MAC2JBTestBuild' gui/Info.plist)" = false ]; then
            python3 scripts/prepare-gui-release-assets.py build/mac2jb.app build
            (cd build && shasum -a 256 -c "mac2jb-v${VERSION}-sha256sums")
          fi
